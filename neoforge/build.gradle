plugins {
	id 'multiloader-loader'
	id 'net.neoforged.moddev'
}

sourceSets {
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

neoForge {
	version = neoforge_version
	runs {
		configureEach {
			systemProperty('neoforge.enabledGameTestNamespaces', 'tailings_gametest')
		}
		client {
			client()
			gameDirectory = project.file('runs/client')
		}
		server {
			server()
			gameDirectory = project.file('runs/server')
			programArgument('--nogui')
		}
		gameTestServer {
			type = 'gameTestServer'
			gameDirectory = project.file('runs/gametest')
			sourceSet = sourceSets.gametest
		}
	}
	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
		"tailings_gametest" {
			sourceSet sourceSets.gametest
		}
	}
}

dependencies {
	// The NeoForge release jar (Mojmap). Not bundled: neoforge.mods.toml requires Wildcatter at runtime.
	compileOnly("dev.wildcatter:wildcatter-neoforge:${wildcatter_version}")
	runtimeOnly("dev.wildcatter:wildcatter-neoforge:${wildcatter_version}")
}

tasks.named('check') {
	dependsOn(tasks.named('compileGametestJava'))
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
	configurations.named(variant) {
		attributes {
			attribute(loaderAttribute, 'neoforge')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].findAll { configurations.findByName(it) != null }.each { variant ->
		configurations.named(variant) {
			attributes {
				attribute(loaderAttribute, 'neoforge')
			}
		}
	}
}
