plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

// Common compiles against plain vanilla Minecraft (NeoForm), so nothing here can reach a loader's API.
neoForge {
	neoFormVersion = neo_form_version
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = 'Fabric'
				url = uri('https://maven.fabricmc.net')
			}
		}
		filter {
			includeGroupAndSubgroups('net.fabricmc')
		}
	}
	exclusiveContent {
		forRepository {
			ivy {
				name = 'WildcatterGitHubReleases'
				url = 'https://github.com/timhunsaker-alt/Wildcatter/releases/download'
				patternLayout {
					artifact 'v[revision]/[artifact]-[revision].[ext]'
				}
				metadataSources {
					artifact()
				}
			}
		}
		filter {
			includeGroup(wildcatter_group)
		}
	}
}

dependencies {
	// Fabric and NeoForge both bundle Mixin, so common can hold mixins
	compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
	// Mojmap jar, so common can call Wildcatter's motor and multiblock helpers. Not bundled.
	compileOnly("dev.wildcatter:wildcatter-neoforge:${wildcatter_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
	useJUnitPlatform()
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Recovery and rock stay plain Java (no Minecraft or loader imports). See README.
tasks.register('verifyPlainJava') {
	def sources = fileTree('src/main/java/dev/wildcatter/tailings') { include 'recovery/**/*.java', 'rock/**/*.java' }
	inputs.files(sources)
	doLast {
		sources.each { f ->
			if (f.text =~ /(?m)^\s*import\s+(net\.minecraft|net\.fabricmc|net\.neoforged|com\.mojang)\./) {
				throw new GradleException("${f.name} imports Minecraft or a loader; recovery and rock must be plain Java")
			}
		}
	}
}
compileJava.dependsOn verifyPlainJava

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
	configurations.named(variant) {
		attributes {
			attribute(loaderAttribute, 'common')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.named(variant) {
			attributes {
				attribute(loaderAttribute, 'common')
			}
		}
	}
}
