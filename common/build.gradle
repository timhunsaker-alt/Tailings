plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

// Common compiles against plain vanilla Minecraft (NeoForm), so nothing here can reach a loader's API.
neoForge {
	neoFormVersion = neo_form_version
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = 'Fabric'
				url = uri('https://maven.fabricmc.net')
			}
		}
		filter {
			includeGroupAndSubgroups('net.fabricmc')
		}
	}
}

dependencies {
	// Fabric and NeoForge both bundle Mixin, so common can hold mixins
	compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
	useJUnitPlatform()
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// The recovery package must stay plain Java (no Minecraft or loader imports). See README.
tasks.register('verifyRecoveryPurity') {
	def sources = fileTree('src/main/java/dev/wildcatter/tailings/recovery') { include '**/*.java' }
	inputs.files(sources)
	doLast {
		sources.each { f ->
			if (f.text =~ /(?m)^\s*import\s+(net\.minecraft|net\.fabricmc|net\.neoforged|com\.mojang|dev\.wildcatter\.(?!tailings\.recovery))/) {
				throw new GradleException("${f.name} imports Minecraft, a loader, or code outside the recovery package; recovery must be plain Java")
			}
		}
	}
}
compileJava.dependsOn verifyRecoveryPurity

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
	configurations.named(variant) {
		attributes {
			attribute(loaderAttribute, 'common')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.named(variant) {
			attributes {
				attribute(loaderAttribute, 'common')
			}
		}
	}
}
