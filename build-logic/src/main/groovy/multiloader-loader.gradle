plugins {
    id 'multiloader-common'
}

// Wildcatter 0.2.0 jars published on GitHub Releases. Each loader depends on its own jar, compile only.
repositories {
    exclusiveContent {
        forRepository {
            ivy {
                name = 'WildcatterGitHubReleases'
                url = findProperty('wildcatter_repo') ?: 'https://github.com/timhunsaker-alt/Wildcatter/releases/download'   // -Pwildcatter_repo=file:/... builds against jars not yet released
                patternLayout {
                    artifact 'v[revision]/[artifact]-[revision].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeGroup(wildcatter_group)
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
